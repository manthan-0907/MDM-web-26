<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CM25091</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>


<body class="min-h-screen flex items-center justify-center p-4
             bg-gradient-to-br from-indigo-700 via-purple-700 to-pink-600">

    <!-- Background Circles -->

    <div class="fixed top-10 left-10 w-40 h-40
                bg-blue-400/30 rounded-full blur-3xl">
    </div>

    <div class="fixed bottom-10 right-10 w-52 h-52
                bg-pink-400/30 rounded-full blur-3xl">
    </div>


    <!-- Main Container -->

    <div class="relative w-full max-w-2xl">

        <!-- Glass Card -->

        <div class="bg-white/95 backdrop-blur-xl
                    rounded-[2rem]
                    shadow-2xl
                    overflow-hidden">


            <!-- Header -->

            <div class="relative bg-gradient-to-r
                        from-indigo-600
                        via-purple-600
                        to-pink-600
                        px-6 py-8 text-white text-center">

                <!-- Floating Icon -->

                <div class="floating mx-auto mb-4
                            w-20 h-20
                            rounded-2xl
                            bg-white/20
                            backdrop-blur-md
                            border border-white/30
                            flex items-center justify-center
                            shadow-xl">

                    <span class="text-4xl">
                        🎓
                    </span>

                </div>


                <h1 class="text-3xl sm:text-4xl font-black tracking-tight">

                    Student Result Calculator

                </h1>


                <p class="mt-2 text-white/80 text-sm sm:text-base">

                    Calculate your marks, percentage & grade instantly

                </p>

            </div>


            <!-- Form Section -->

            <div class="p-6 sm:p-8">


                <!-- Input Grid -->

                <div class="grid md:grid-cols-3 gap-5">


                    <!-- Practical 1 -->

                    <div class="group">

                        <label class="block text-sm font-bold
                                      text-gray-700 mb-2">

                            📘 Practical 1

                        </label>


                        <div class="relative">

                            <input
                                type="number"
                                id="j1"
                                min="0"
                                max="100"
                                placeholder="0 - 100"
                                class="w-full px-4 py-4
                                       rounded-2xl
                                       border-2 border-gray-200
                                       bg-gray-50
                                       text-lg font-semibold
                                       outline-none
                                       transition-all
                                       duration-300
                                       focus:bg-white
                                       focus:border-indigo-500
                                       focus:ring-4
                                       focus:ring-indigo-100
                                       group-hover:border-indigo-300">

                        </div>

                    </div>


                    <!-- Practical 2 -->

                    <div class="group">

                        <label class="block text-sm font-bold
                                      text-gray-700 mb-2">

                            📗 Practical 2

                        </label>


                        <input
                            type="number"
                            id="j2"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            class="w-full px-4 py-4
                                   rounded-2xl
                                   border-2 border-gray-200
                                   bg-gray-50
                                   text-lg font-semibold
                                   outline-none
                                   transition-all
                                   duration-300
                                   focus:bg-white
                                   focus:border-purple-500
                                   focus:ring-4
                                   focus:ring-purple-100
                                   group-hover:border-purple-300">

                    </div>


                    <!-- Viva -->

                    <div class="group">

                        <label class="block text-sm font-bold
                                      text-gray-700 mb-2">

                            🎤 Viva / Oral

                        </label>


                        <input
                            type="number"
                            id="viva"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            class="w-full px-4 py-4
                                   rounded-2xl
                                   border-2 border-gray-200
                                   bg-gray-50
                                   text-lg font-semibold
                                   outline-none
                                   transition-all
                                   duration-300
                                   focus:bg-white
                                   focus:border-pink-500
                                   focus:ring-4
                                   focus:ring-pink-100
                                   group-hover:border-pink-300">

                    </div>

                </div>


                <!-- Calculate Button -->

                <button
                    onclick="calculateResult()"
                    class="mt-7 w-full
                           py-4
                           rounded-2xl
                           bg-gradient-to-r
                           from-indigo-600
                           via-purple-600
                           to-pink-600
                           text-white
                           text-lg
                           font-extrabold
                           shadow-lg
                           shadow-purple-300
                           hover:shadow-2xl
                           hover:scale-[1.02]
                           active:scale-95
                           transition-all
                           duration-300">

                    ✨ Calculate My Result

                </button>


                <!-- Result -->

                <div id="resultBox"
                     class="mt-8">


                    <!-- Result Heading -->

                    <div class="flex items-center gap-3 mb-5">

                        <div class="w-2 h-9
                                    rounded-full
                                    bg-gradient-to-b
                                    from-indigo-500
                                    to-pink-500">
                        </div>

                        <div>

                            <h2 class="text-2xl font-black text-gray-800">

                                Your Result

                            </h2>

                            <p class="text-sm text-gray-400">

                                Performance summary

                            </p>

                        </div>

                    </div>


                    <!-- Result Cards -->

                    <div class="grid grid-cols-2 gap-4">


                        <!-- Total -->

                        <div class="relative overflow-hidden
                                    rounded-2xl
                                    bg-gradient-to-br
                                    from-blue-50
                                    to-indigo-100
                                    border border-blue-100
                                    p-5">

                            <div class="absolute -right-5 -top-5
                                        w-20 h-20
                                        rounded-full
                                        bg-blue-200/50">
                            </div>

                            <p class="text-sm font-bold
                                      text-indigo-600">

                                TOTAL MARKS

                            </p>

                            <p id="total"
                               class="mt-2 text-3xl font-black
                                      text-gray-800">

                                -- / 300

                            </p>

                        </div>


                        <!-- Percentage -->

                        <div class="relative overflow-hidden
                                    rounded-2xl
                                    bg-gradient-to-br
                                    from-purple-50
                                    to-pink-100
                                    border border-purple-100
                                    p-5">

                            <div class="absolute -right-5 -top-5
                                        w-20 h-20
                                        rounded-full
                                        bg-pink-200/50">
                            </div>

                            <p class="text-sm font-bold
                                      text-purple-600">

                                PERCENTAGE

                            </p>

                            <p id="percentage"
                               class="mt-2 text-3xl font-black
                                      text-gray-800">

                                -- %

                            </p>

                        </div>

                    </div>


                    <!-- Progress Bar -->

                    <div class="mt-5">

                        <div class="flex justify-between
                                    text-sm font-semibold
                                    text-gray-500 mb-2">

                            <span>Performance</span>

                            <span id="progressText">
                                0%
                            </span>

                        </div>


                        <div class="h-4 bg-gray-200
                                    rounded-full overflow-hidden">

                            <div id="progressBar"
                                 class="h-full
                                        rounded-full
                                        bg-gradient-to-r
                                        from-indigo-500
                                        via-purple-500
                                        to-pink-500
                                        transition-all
                                        duration-1000"
                                 style="width: 0%">

                            </div>

                        </div>

                    </div>


                    <!-- Grade -->

                    <div class="mt-6
                                rounded-3xl
                                bg-gradient-to-r
                                from-gray-900
                                to-gray-800
                                p-6
                                text-center
                                shadow-xl">

                        <p class="text-gray-400
                                  text-sm
                                  font-bold
                                  uppercase
                                  tracking-widest">

                            Final Grade

                        </p>


                        <div id="grade"
                             class="mt-2
                                    text-6xl
                                    font-black
                                    text-white">

                            --

                        </div>


                        <p id="message"
                           class="mt-2 text-gray-400">

                            Enter your marks to see your result

                        </p>

                    </div>

                </div>

            </div>


            <!-- Footer -->

            <div class="px-6 py-4
                        bg-gray-50
                        border-t
                        text-center">

                <p class="text-xs text-gray-400">

                    Student Result Calculator • Built with Tailwind CSS

                </p>

            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        function calculateResult() {

            let p1 = Number(document.getElementById("j1").value);
            let p2 = Number(document.getElementById("j2").value);
            let viva = Number(document.getElementById("viva").value);


            // Validation

            if (
                p1 < 0 || p1 > 100 ||
                p2 < 0 || p2 > 100 ||
                viva < 0 || viva > 100
            ) {

                alert("Please enter marks between 0 and 100.");

                return;

            }


            // Total

            let total = p1 + p2 + viva;


            // Percentage

            let percentage = (total / 300) * 100;


            // Grade

            let grade;

            let message;


            if (percentage >= 90) {

                grade = "A+";
                message = "🏆 Outstanding Performance!";

            }

            else if (percentage >= 80) {

                grade = "A";
                message = "🌟 Excellent Performance!";

            }

            else if (percentage >= 70) {

                grade = "B";
                message = "👏 Very Good Performance!";

            }

            else if (percentage >= 60) {

                grade = "C";
                message = "👍 Good Performance!";

            }

            else if (percentage >= 50) {

                grade = "D";
                message = "💪 Keep Improving!";

            }

            else {

                grade = "F";
                message = "📚 More Practice Needed";

            }


            // Display values

            document.getElementById("total").innerHTML =
                total + " / 300";


            document.getElementById("percentage").innerHTML =
                percentage.toFixed(2) + "%";


            document.getElementById("grade").innerHTML =
                grade;


            document.getElementById("message").innerHTML =
                message;


            // Progress bar

            document.getElementById("progressBar").style.width =
                percentage + "%";


            document.getElementById("progressText").innerHTML =
                percentage.toFixed(0) + "%";


            // Grade colors

            let gradeElement =
                document.getElementById("grade");


            gradeElement.className =
                "mt-2 text-6xl font-black";


            if (grade === "A+") {

                gradeElement.classList.add(
                    "text-green-400"
                );

            }

            else if (grade === "A") {

                gradeElement.classList.add(
                    "text-blue-400"
                );

            }

            else if (grade === "B") {

                gradeElement.classList.add(
                    "text-yellow-400"
                );

            }

            else if (grade === "C") {

                gradeElement.classList.add(
                    "text-orange-400"
                );

            }

            else {

                gradeElement.classList.add(
                    "text-red-400"
                );

            }

        }

    </script>

</body>

</html>
