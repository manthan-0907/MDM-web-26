<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Menu</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- Food Menu Section -->
  <section class="max-w-6xl mx-auto px-6 py-12">

    <h1 class="text-4xl font-bold text-center text-gray-800 mb-3">
      Welcome to Brunch Cafe
  
    </h1>

    <p class="text-center text-gray-600 mb-10">
      Taste the best dishes from our menu
    </p>

    <!-- Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

      <!-- Card 1 -->
      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <img
          src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"
          alt="Pizza"
          class="w-full h-48 object-cover"
        >

        <div class="p-5">
          <h2 class="text-2xl font-bold text-gray-800 mb-2">
            Cheese Pizza
          </h2>

          <p class="text-gray-600 mb-4">
            Delicious cheesy pizza topped with fresh vegetables and herbs.
          </p>

          <button class="bg-orange-500 text-white px-5 py-2 rounded-lg hover:bg-orange-600">
            Order Now
          </button>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <img
          src="burger.jpg.jpeg"
          alt="Burger"
          class="w-full h-48 object-cover"
        >

        <div class="p-5">
          <h2 class="text-2xl font-bold text-gray-800 mb-2">
            Classic Burger
          </h2>

          <p class="text-gray-600 mb-4">
            Juicy grilled burger served with fresh lettuce, tomato and cheese.
          </p>

          <button class="bg-orange-500 text-white px-5 py-2 rounded-lg hover:bg-orange-600">
            Order Now
          </button>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <img
          src="https://images.unsplash.com/photo-1551183053-bf91a1d81141"
          alt="Pasta"
          class="w-full h-48 object-cover"
        >

        <div class="p-5">
          <h2 class="text-2xl font-bold text-gray-800 mb-2">
            Creamy Pasta
          </h2>

          <p class="text-gray-600 mb-4">
            Creamy pasta cooked with fresh vegetables and Italian herbs.
          </p>

          <button class="bg-orange-500 text-white px-5 py-2 rounded-lg hover:bg-orange-600">
            Order Now
          </button>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
